[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "people-counter-local"
version = "1.0.0"
description = "Local camera person detection, multi-object tracking and bidirectional counting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
desktop = ["opencv-python>=4.10,<5"]
headless = ["opencv-python-headless>=4.10,<5"]
yolo = ["ultralytics>=8.3,<9"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
people-counter = "people_counter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["model: optional real YOLO inference (requires locally available weights)"]

[tool.coverage.run]
source = ["people_counter"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
